# Which sources the job-hunt skill and engine use. Edit freely; nothing here is personal.
# "api" sources run from code (automations/jobhunt). "claude" sources are driven by the
# job-hunt skill through connectors/search. See .claude/skills/job-hunt/references/.

[search_defaults]
country = "gb"          # Adzuna country code (gb, us, au, ca, de, fr, nl, ...)
max_age_days = 14
results_per_source = 50

[sources.indeed_mcp]    # claude: official Indeed connector
enabled = true

[sources.adzuna]        # api: aggregates many boards in one call; needs a free key
enabled = true

[sources.reed]          # api: UK only; needs a free key
enabled = true

[sources.ats_search]    # claude: site: web searches over company career pages
enabled = true
providers = ["boards.greenhouse.io", "jobs.lever.co", "jobs.ashbyhq.com", "apply.workable.com"]

[sources.gmail_alerts]  # claude: read job-alert emails from a PERSONAL inbox
enabled = true

[sources.chrome]        # claude: Claude in Chrome, your own logged-in browser, read-only
mode = "ask"            # "off" = never | "ask" = offer each run | "on" = use when available
sites = ["linkedin", "glassdoor"]
max_pages_per_site = 3  # keep usage light
# Glassdoor is best used for salary/review research on shortlisted companies,
# not for job discovery. LinkedIn is for discovery.

[linkcheck]
enabled = true
